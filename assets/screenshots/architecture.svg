<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">A Flutter mobile app authenticates with Supabase over HTTPS using a JWT, reads and writes Postgres rows protected by row level security, and invokes a Deno edge function that proxies requests to the Anthropic Claude Messages API.</desc>

